name: Verify public demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Verify rules, UI, and simulations
        run: scripts/ci/verify.sh
      - name: Prepare export directories
        run: mkdir -p export/windows export/macos
      - name: Export Windows build
        run: godot --headless --path . --export-release "Windows Desktop" export/windows/BengzhuiCards.exe
      - name: Export macOS build
        run: godot --headless --path . --export-release "macOS" export/macos/BengzhuiCards.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bengzhui-public-demo
          path: export/
          if-no-files-found: error

  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Run rules and fixed simulation
        shell: bash
        env:
          SIMULATION_MATCHES: 1000
        run: scripts/ci/verify.sh
      - name: Prepare export directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force export/windows | Out-Null
      - name: Export Windows x86_64
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'export/windows/BengzhuiCards.exe'
          & $env:GODOT --headless --verbose --path $PWD --export-release "Windows Desktop" $output
          Get-ChildItem -Force -Recurse export
      - name: Run Windows export smoke
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Recurse export/windows -Filter '*.exe' | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($executable)) { throw 'Windows export executable was not produced.' }
          & $executable --export-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: bengzhui-windows-dev2
          path: export/windows/
          if-no-files-found: error
